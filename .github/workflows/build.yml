name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  RAYLIB_VERSION: "5.5"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libvlc-dev libglib2.0-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Build raylib
        run: |
          git clone --depth 1 --branch "$RAYLIB_VERSION" https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j
          sudo cmake --install /tmp/raylib/build
          sudo ldconfig

      - name: Build
        run: make

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install pkg-config raylib glib
          brew install --cask vlc
          ls /Applications/VLC.app/Contents/MacOS /Applications/VLC.app/Contents/MacOS/include/vlc

      - name: Build
        run: make

      - name: Check linking
        run: otool -L raylib-libvlc-example

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make
          pacboy: gcc:p pkgconf:p raylib:p glib2:p vlc:p

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: raylib-libvlc-example-windows
          path: raylib-libvlc-example.exe
